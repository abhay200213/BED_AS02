name: Backend API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test, Lint and Build
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run ESLint
      - name: Run ESLint
        run: npm run lint

      # Verify TypeScript compilation
      - name: Build TypeScript
        run: npm run build

      # Run Jest tests
      - name: Run Jest tests
        run: npm test -- --ci